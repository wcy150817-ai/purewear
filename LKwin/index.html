<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Big Win - Claim Now</title>
    <style>
        /* --- 全局重置与基础设置 --- */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* 移除移动端点击高亮 */
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* 高对比度深色背景，不使用模糊渐变，提升性能 */
            background-color: #1a0b2e;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* 背景装饰：简单的几何图形，性能极低 */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(
                45deg,
                #1a0b2e,
                #1a0b2e 20px,
                #23123f 20px,
                #23123f 40px
            );
            opacity: 0.3;
            z-index: 0;
            pointer-events: none;
        }

        /* --- 主容器 --- */
        .main-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            gap: 25px;
        }

        /* --- 通用链接包裹层 --- */
        a.clickable-link {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            text-decoration: none;
            cursor: pointer;
        }

        /* --- 1. 核心图标：扁平化礼包 (SVG) --- */
        .gift-container {
            width: 32vmin;
            height: 32vmin;
            max-width: 200px;
            max-height: 200px;
            position: relative;
            animation: bounce-hard 0.8s cubic-bezier(0.28, 0.84, 0.42, 1) infinite alternate;
        }

        /* SVG 图标样式 */
        .gift-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 10px 0 #7b1fa2); /* 硬阴影，不模糊，性能高 */
            transform: translateY(5px);
        }
        
        .gift-box-body { fill: #ff0055; } /* 亮粉色 */
        .gift-ribbon-v { fill: #ffd700; }  /* 金色 */
        .gift-ribbon-h { fill: #ffd700; }
        .gift-bow { fill: #ffcc00; }

        /* --- 2. 文字区域：高冲击力排版 --- */
        .text-container {
            text-align: center;
            width: 100%;
        }

        .main-title {
            display: block;
            font-size: clamp(2.5rem, 10vw, 4rem);
            line-height: 1;
            font-weight: 900;
            color: #fff;
            /* 锐利的文字阴影，非模糊光晕 */
            text-shadow: 4px 4px 0px #ff0055, 8px 8px 0px rgba(0,0,0,0.3);
            text-transform: uppercase;
            letter-spacing: -1px; /* 紧凑更有力 */
            animation: pulse-text 1s ease-in-out infinite alternate;
            margin-bottom: 10px;
        }

        .sub-title {
            display: block;
            font-size: clamp(1rem, 4vw, 1.4rem);
            font-weight: 700;
            color: #ffd700;
            background: #000;
            padding: 8px 16px;
            border-radius: 4px;
            display: inline-block;
            box-shadow: 0 4px 0 #333;
            text-transform: uppercase;
        }

        /* --- 3. 按钮：3D 游戏风格 --- */
        .btn-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        .claim-btn {
            position: relative;
            background-color: #00d2ff; /* 赛博蓝 */
            color: #000;
            border: none;
            padding: 18px 40px;
            font-size: clamp(1.2rem, 5vw, 1.8rem);
            font-weight: 900;
            text-transform: uppercase;
            border-radius: 12px;
            width: 100%;
            max-width: 320px;
            /* 纯CSS 3D效果 */
            box-shadow: 
                0 6px 0 #005f73, 
                0 15px 20px rgba(0,0,0,0.4);
            transition: transform 0.05s, box-shadow 0.05s;
            cursor: pointer;
            user-select: none;
        }

        .claim-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #005f73, inset 0 2px 5px rgba(0,0,0,0.2);
        }

        /* --- 高性能动画定义 --- */

        /* 快速跳动 */
        @keyframes bounce-hard {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-15px) scale(1.05); }
        }

        /* 文字脉冲 */
        @keyframes pulse-text {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

    </style>
</head>
<body>

    <div class="main-container">

        <!-- 
             1. 核心图标：矢量SVG礼包
             使用SVG替代图片和复杂CSS图形，任何屏幕都清晰
        -->
        <a href="https://today.click2future.com/click?lp=1" class="clickable-link">
            <div class="gift-container">
                <svg class="gift-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <!-- 盒子主体 -->
                    <rect x="15" y="40" width="70" height="50" rx="4" class="gift-box-body" />
                    <!-- 盒盖 -->
                    <rect x="10" y="35" width="80" height="15" rx="2" class="gift-box-body" />
                    <!-- 垂直丝带 -->
                    <rect x="45" y="40" width="10" height="50" class="gift-ribbon-v" />
                    <!-- 水平丝带 -->
                    <rect x="15" y="50" width="70" height="10" class="gift-ribbon-h" />
                    <!-- 蝴蝶结 -->
                    <path d="M50 35 C 60 15, 80 15, 85 25 C 90 35, 70 45, 50 35 Z" class="gift-bow" />
                    <path d="M50 35 C 40 15, 20 15, 15 25 C 10 35, 30 45, 50 35 Z" class="gift-bow" />
                </svg>
            </div>
        </a>

        <!-- 
             2. 文字区域：锐利、直接
        -->
        <a href="https://today.click2future.com/click?lp=1" class="clickable-link">
            <div class="text-container">
                <span class="main-title">BIG WIN!</span>
                <span class="sub-title">Tap To Claim</span>
            </div>
        </a>

        <!-- 
             3. 按钮：高对比度，3D按压感
        -->
        <div class="btn-container">
            <a href="https://today.click2future.com/click?lp=1">
                <button class="claim-btn">CLAIM PRIZE</button>
            </a>
        </div>

    </div>
<script type='text/javascript'>
    var back_ntb_link ='https://today.click2future.com/click?key=c5b84babd80f410d926654d812d07401&visitor_id=${SUBID}&cost={cost}&zoneid={zoneid}&campaignid={campaignid}&device={device}&browser={browser}&os={os}&osversion={osversion}&country={country}&language={language}&isp={isp}&user_activity={user_activity}';
    if (typeof back_ntb_link !== 'undefined' && back_ntb_link !== null) {
        !(function() {
            var t;
            try {
                const URL = window.location.href.split(/[#]/)[0];
                for (t = 0; 10 > t; ++t) history.pushState({}, '', URL + '#');
                onpopstate = function(event) {
                    event.state && location.replace(back_ntb_link);
                };
            } catch (o) {
                console.log(o);
            }
        })();
    }
</script>
</body>
</html>
